# Конфиг системного Nginx для хоста Timeweb (89.223.122.221, Ubuntu 18.04 + VestaCP).
# Деплой: скопировать в /etc/nginx/conf.d/padel-russia.conf && nginx -t && systemctl reload nginx
#
# Отличия от nginx/prod.conf (шаблона для «чистого» хоста):
#   - listen на IP хоста — как у соседних сайтов Vesta (общий сокет с ними,
#     wildcard-listen тут создал бы конфликт бинда и уронил бы чужие сайты);
#   - server_name БЕЗ IP, чтобы IP-трафик шёл в дефолтный vhost Vesta, а не к нам;
#   - прокси на хост-порты 3100/3101: 127.0.0.1:3000 занят соседним next-server
#     (значения берутся из .env: FRONTEND_HOST_PORT / BACKEND_HOST_PORT);
#   - отдельный ACME-webroot для выпуска сертификата (certbot --webroot).

server {
    listen 89.223.122.221:80;
    server_name padel-russia.online www.padel-russia.online;

    # ACME HTTP-01: certbot certonly --webroot -w /var/lib/padel-russia-acme ...
    location /.well-known/acme-challenge/ {
        root /var/lib/padel-russia-acme;
    }

    location / {
        return 301 https://padel-russia.online$request_uri;
    }
}

server {
    listen 89.223.122.221:443 ssl;
    server_name padel-russia.online www.padel-russia.online;

    # Сертификаты Let's Encrypt (certbot.timer уже установлен на хосте)
    ssl_certificate /etc/letsencrypt/live/padel-russia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padel-russia.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    access_log /var/log/nginx/padel-russia-access.log;
    error_log /var/log/nginx/padel-russia-error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Статика /images — напрямую из docker volume (для этого setup-host.sh
    # даёт www-data traverse: chmod o+x /var/lib/docker + systemd drop-in)
    location /images/ {
        alias /var/lib/docker/volumes/padel-russia_images-data/_data/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Next.js static assets — immutable, кэш на 1 год (хэш в имени файла)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API бэкенда: клиент Next.js обращается к /api/*, префикс /api срезается
    location /api/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # Frontend — Next.js SSR
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Upload (API-only, нет конфликта со страницами Next.js)
    location /upload {
        proxy_pass http://127.0.0.1:3101/upload;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }

    location /health {
        proxy_pass http://127.0.0.1:3101/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
