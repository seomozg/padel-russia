# Временный конфиг для выпуска сертификата (до существования
# /etc/letsencrypt/live/padel-russia.online/). Заменяется на nginx/timeweb.conf.
server {
    listen 89.223.122.221:80;
    server_name padel-russia.online www.padel-russia.online;

    location /.well-known/acme-challenge/ {
        root /var/lib/padel-russia-acme;
    }

    location / {
        return 301 https://padel-russia.online$request_uri;
    }
}
