version: '3.8'

services:
  backend:
    build: ./backend
    expose:
      - "3001"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - REDIS_ENABLED=false
      - NODE_ENV=production
    volumes:
      - db-data:/app/prisma
      - images-data:/app/public/images
    restart: unless-stopped
    networks:
      - padel-network

  frontend:
    build:
      context: ./frontend-next
      args:
        - NEXT_PUBLIC_YANDEX_MAPS_API_KEY=34dbd6cf-1644-4d20-b774-b789a9613935
        - NEXT_PUBLIC_SITE_URL=https://padel-russia.online
        # NEXT_PUBLIC_API_URL пустой = запросы идут на тот же домен, nginx проксирует к backend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - images-data:/app/public/images
    restart: unless-stopped
    networks:
      - padel-network

volumes:
  db-data:
  images-data:

networks:
  padel-network:
    driver: bridge
