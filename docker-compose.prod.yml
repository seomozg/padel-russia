version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      # nginx (prod.conf) проксирует /api, /upload, /health на backend:3001
      # Хост-порт настраиваем (.env): на Timeweb 127.0.0.1:3000 занят соседним
      # next-server → в .env задан BACKEND_HOST_PORT=3101
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3001"
    expose:
      - "3001"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      # Секреты берутся из корневого .env (читают compose и scripts/cron-news.sh)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # Ключи сборщика кортов (discovery/geocode внутри контейнера)
      - YANDEX_MAPS_API_KEY=${YANDEX_MAPS_API_KEY}
      - GIS_MAPS_API_KEY=${GIS_MAPS_API_KEY}
      # Node 18 не имеет глобального File — скрипты (scrape/discover) требуют полифайл
      - NODE_OPTIONS=--require /app/scripts/polyfill-file.js
      - REDIS_ENABLED=false
      - NODE_ENV=production
    volumes:
      - db-data:/app/prisma
      - images-data:/app/public/images
    restart: unless-stopped
    networks:
      - padel-network

  frontend:
    build:
      context: ./frontend-next
      args:
        - NEXT_PUBLIC_YANDEX_MAPS_API_KEY=34dbd6cf-1644-4d20-b774-b789a9613935
        - NEXT_PUBLIC_SITE_URL=https://padel-russia.online
        # Клиентские запросы идут на '/api' → nginx → backend:3001
        - NEXT_PUBLIC_API_URL=/api
    environment:
      - BACKEND_URL=http://backend:3001
      - NEXT_PUBLIC_API_URL=/api
    ports:
      # Хост-порт настраиваем (.env): 127.0.0.1:3000 на Timeweb занят соседним
      # next-server → в .env задан FRONTEND_HOST_PORT=3100
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - images-data:/app/public/images
    restart: unless-stopped
    networks:
      - padel-network

volumes:
  db-data:
  images-data:

networks:
  padel-network:
    driver: bridge
